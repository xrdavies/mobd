name: CI
# Checks every push to main and every pull request to main (other branches run nothing until a
# pull request is open); it makes no downloads, see build.yml for those. macOS runs the full suite (desktop tests that need a
# logged-in Mac with Screen Recording skip themselves); Linux runs everything that builds there;
# Windows must at least build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The live view's encoder (cgo, GStreamer with OpenH264) and a real Xvfb and xterm for the
      # X11 tests, which skip without them.
      - name: Linux desktop packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb xterm x11-xkb-utils
      - name: Vet
        run: go vet ./...
      # The same tests as the release build, including the slow live-view link tests.
      - name: Test
        run: go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Version files agree
        run: node .github/release/version.mjs --check
      - name: Pi RPC and MCP smoke test (local model only)
        run: |
          npm install --prefix "$RUNNER_TEMP/mobd-pi" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          MOBD_PI_TEST_BIN="$RUNNER_TEMP/mobd-pi/node_modules/.bin/pi" go test -race -run TestRealPi -v ./internal/runner/pi
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./... && go vet ./...
